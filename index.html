<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <!-- Nova fonte elegante e limpa -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Usando a nova fonte */
            font-family: 'Playfair Display', serif; 
            text-align: center;
            background-color: black;
            color: white;
            margin: 0;
            padding: 20px;
        }
        
        #login-screen {
            margin-top: 35vh; /* Centraliza a caixa na tela */
        }
        
        /* Caixa de senha mantida elegante e discreta */
        input {
            padding: 10px;
            font-size: 18px;
            background: transparent; 
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5); 
            color: white;
            width: 250px; 
            max-width: 90%;
            margin-bottom: 25px;
            text-align: center;
            outline: none;
            font-family: Arial, sans-serif; /* Fonte normal para os pontinhos da senha ficarem legíveis */
        }
        
        /* Botão entrar discreto e minimalista */
        button {
            padding: 8px 25px;
            font-size: 18px;
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5); 
            border-radius: 20px; 
            cursor: pointer;
            font-family: 'Playfair Display', serif;
            transition: 0.3s;
        }
        
        /* Efeito sutil ao passar o mouse ou clicar */
        button:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        button:active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        #mensagem-erro {
            color: #ff4d4d; /* Vermelho suave para combinar com a tela preta */
            font-size: 20px;
            margin-top: 25px;
            display: none; /* Escondido no começo */
        }

        #gallery-screen {
            display: none; 
        }
        
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        .gallery-grid img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- Tela de Senha (Minimalista) -->
    <div id="login-screen">
        <input type="password" id="senha" placeholder="Digite a senha">
        <br>
        <button onclick="verificarSenha()">Entrar</button>
        
        <!-- Onde a dica vai aparecer dinamicamente -->
        <p id="mensagem-erro"></p>
    </div>

    <!-- Tela da Galeria (Direto nas fotos) -->
    <div id="gallery-screen">
        <div class="gallery-grid">
            <!-- Suas fotos entram aqui -->
            <img src="fotos/foto1.jpg" alt="Foto">
            <img src="fotos/foto2.jpg" alt="Foto">
            <img src="fotos/foto3.jpg" alt="Foto">
        </div>
    </div>

    <script>
        // Variável que vai contar quantas vezes a senha foi errada
        var tentativasErro = 0; 

        function verificarSenha() {
            var senhaDigitada = document.getElementById("senha").value;
            var senhaCorreta = "enamora"; 
            var mensagem = document.getElementById("mensagem-erro");

            if (senhaDigitada === senhaCorreta) {
                // Se acertar, mostra a galeria
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("gallery-screen").style.display = "block";
            } else {
                // Se errar, aumenta o número de tentativas
                tentativasErro++; 
                mensagem.style.display = "block"; // Mostra o texto

                // Lógica das dicas
                if (tentativasErro < 2) {
                    mensagem.innerHTML = "Senha incorreta. Tente novamente...";
                } else if (tentativasErro >= 2 && tentativasErro < 4) {
                    mensagem.innerHTML = "Dica: Flor";
                } else if (tentativasErro >= 4 && tentativasErro < 6) {
                    mensagem.innerHTML = "Dica: apaixonar";
                } else if (tentativasErro >= 6) {
                    mensagem.innerHTML = "Dica: carta";
                }

                // Apaga o que ela digitou na caixa para facilitar a nova tentativa
                document.getElementById("senha").value = "";
            }
        }
    </script>

</body>
</html>
.
